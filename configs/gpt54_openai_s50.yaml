# OpenAI Chat Completions — study2 s50; baseline e.g. `results/runs_s50/gpt-5.4_20260412T043325Z` (item_metrics + raw_generations).
# Uses OPENAI_API_KEY from .env. Optional OPENAI_BASE_URL (default api.openai.com).
providers:
  openai:
    enabled: true
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY
    base_url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    # Use system proxy (e.g. ~/.bashrc → 127.0.0.1:18080) for api.openai.com; trust_env false ignores HTTP_PROXY.
    trust_env: true
    # Official API + shared proxy: keep low to reduce 429 bursts on large sampling jobs.
    concurrency: 1
    max_retries: 12
    timeout_seconds: 300
    temperature: 1.0
    max_output_tokens: 256

sampling:
  panel_id: study2_british_within
  answer_language: English
  prompt_languages: [en, zh]
  round1_samples: 50
  round2_samples: 10
  enable_round2: true
  round2_trigger: cross_lingual_top1_mismatch
  random_seed: 20260324

normalization:
  alias_path: ../data/aliases/default_aliases.csv
  allow_unmapped: false
  fuzzy_match_threshold: 95

analysis:
  bootstrap_resamples: 1000
  item_bootstrap_resamples: 1000

outputs:
  run_root: ${UNIVERSAL_RUN_ROOT:../artifacts/runs}
  cache_root: ${UNIVERSAL_CACHE_ROOT:../artifacts/cache}
